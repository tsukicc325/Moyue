pluginManagement {
    repositories {
        google()
        // 本机实测 Maven Central 只有 25KB/s，阿里云镜像 38MB/s，放前面兜底
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
}

